[package]
name = "tests"
version = "0.0.0-dev0"
edition = "2021"

[features]
default = []
e2e = ["dep:mongodb", "dep:sha2", "dep:hex"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync"] }
testcontainers = "0.26.0"
mongodb = { version = "3", optional = true }
reqwest = { version = "0.12.25", default-features = false, features = ["rustls-tls", "json"] }
# Used by the short_id-collision e2e test to reproduce the routing key on the
# host side (mirror of m87_shared::device::short_device_id).
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
tempfile = "3"
serde_json = "1"
